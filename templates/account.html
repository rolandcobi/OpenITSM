{% extends 'base.html' %}{% block content %}<div class="page-title"><h2>Llogaria ime</h2></div><section class="card" style="max-width:520px"><h3>Edit fjalëkalimin</h3><p><small>{{u.full_name}} · {{u.username}}{% if u.must_change %} — <b>Duhet të vendosni fjalëkalim të ri para se të vazhdoni.</b>{% endif %}</small></p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Fjalëkalimi aktual<input type="password" name="current" required autocomplete="current-password"></label><label>Fjalëkalimi i ri (min. 12 karaktere)<input type="password" name="new" required minlength="12" autocomplete="new-password"></label><label>Përsërit fjalëkalimin e ri<input type="password" name="confirm" required minlength="12" autocomplete="new-password"></label><button>Save fjalëkalimin</button></form></section>{% endblock %}
