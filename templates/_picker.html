<div class="userpicker" data-picker><input type="search" class="up-search" placeholder="🔍 Search users by name, department, email…" autocomplete="off" aria-label="Search users"><div class="up-list">{% for u in users %}<label class="up-item" data-text="{{ ((u.full_name or '')~' '~(u.sector or '')~' '~(u.structure or '')~' '~(u.email or '')~' '~(u.duty or '')~' '~(u.institution or ''))|lower }}"><input type="checkbox" name="task_assignees" value="{{u.id}}"><span><b>{{u.full_name}}</b><small>{{u.duty or u.sector or u.structure or u.role}}{% if u.email %} · {{u.email}}{% endif %}</small></span></label>{% endfor %}<div class="up-none" hidden>No users found.</div></div><div class="up-count"><b class="up-n">0</b> selected <button type="button" class="linkbtn up-clear">clear</button></div></div>
