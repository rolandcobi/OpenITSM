<form method="post" action="{{url_for('space')}}" class="sp-quick"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="task_add"><input type="hidden" name="next" value="{{next_url}}"><input class="grow" name="title" placeholder="Çfarë duhet bërë? (p.sh. Përgatit raportin e muajit)" required maxlength="200"><select name="dest">{% if not only_team %}<option value="me">Vetes (detyrë personale)</option>{% endif %}{% for t in teams_opt %}<optgroup label="Ekipi: {{t.name}}"><option value="t:{{t.id}}:0">{{t.name}} — pa caktuar</option>{% for m in t.members %}<option value="t:{{t.id}}:{{m.id}}">Cakto te: {{m.full_name}}</option>{% endfor %}</optgroup>{% endfor %}</select><select name="source" title="Burimi i detyrës">{% for x in sources %}<option>{{x}}</option>{% endfor %}</select><input name="source_ref" placeholder="Nr. shkresës / muaji (2026-10)" maxlength="80"><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select><input type="date" name="due" title="Due Date"><input class="grow" name="description" placeholder="Shënime (opsionale)" maxlength="2000"><button>＋ Add detyrën</button></form>
