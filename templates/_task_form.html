<form method="post" action="{{url_for('space')}}" class="sp-quick"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="task_add"><input type="hidden" name="next" value="{{next_url}}"><input class="grow" name="title" placeholder="What needs to be done? (e.g. Prepare the monthly report)" required maxlength="200"><select name="dest">{% if not only_team %}<option value="me">Myself (personal task)</option>{% endif %}{% for t in teams_opt %}<optgroup label="Team: {{t.name}}"><option value="t:{{t.id}}:0">{{t.name}} — unassigned</option>{% for m in t.members %}<option value="t:{{t.id}}:{{m.id}}">Assign to: {{m.full_name}}</option>{% endfor %}</optgroup>{% endfor %}</select><select name="source" title="Task source">{% for x in sources %}<option>{{x}}</option>{% endfor %}</select><input name="source_ref" placeholder="Request reference / month (2026-10)" maxlength="80"><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select><input type="date" name="due" title="Due Date"><input class="grow" name="description" placeholder="Notes (optional)" maxlength="2000"><button>＋ Add task</button></form>
