<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenITSM | Sign in</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="cyber-login"><div class="login-shell"><form class="loginbox cyber-box" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="brand-lockup"><img src="{{url_for('static',filename='datacenter-shield.svg')}}" alt="Data center security"><div><strong>OpenITSM</strong><small>IT Service & Operations Management</small></div></div><div class="login-title"><h1>Welcome back</h1><p>Sign in to your service management workspace</p></div>{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<label for="username">Username</label><div class="field"><input id="username" name="username" autocomplete="username" required autofocus></div><label for="password">Password</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="login-submit" type="submit">Sign in →</button><div class="login-foot">OpenITSM · Community Edition</div></form></div></body></html>
