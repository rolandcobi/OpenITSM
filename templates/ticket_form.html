{% extends 'base.html' %}{% block content %}<form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Create Ticket</h2><div class="formgrid"><label>Category<select name="type">{% for tp in ["Service Request","Task"] %}<option {{"selected" if tp==preset}}>{{tp}}</option>{% endfor %}</select></label><label>Service<select name="service_id"><option value="">-</option>{% for s in services %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label>{% if not is_requester %}<label>Route to (unit / department)<select name="unit_id"><option value="">Automatically (by service)</option>{% for o in org_options %}<option value="{{o.id}}">{{'— '*o.depth}}{{o.name}}</option>{% endfor %}</select></label>{% endif %}<label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label><label>SLA (working hours)<input type="number" name="sla_hours" value="24" min="1" max="720"><small class="field-help">Saturdays and Sundays are excluded.</small></label><label class="wide">Title<input name="title" required></label><label class="wide">Description<textarea name="description" required></textarea></label><label>Structure<input name="structure"></label><label>Assignee / User<select name="assignee_id" class="userpick" data-placeholder="Unassigned — search for a user"><option value="">Unassigned</option><option value="{{me_id}}">Myself</option></select><small class="field-help">This is the first workflow step; the assignee is notified immediately. Users come from the user directory.</small></label>
<div class="wide chain"><b>Workflow (optional)</b><small class="field-help">Add steps when a ticket requires several people in sequence. Each person signs their step, then the ticket passes to the next person with an email notification.</small><div id="chainRows"></div><button type="button" class="btn ghost" id="addStep">+ Add next step</button></div>
</div><template id="stepTpl"><div class="chain-row"><select name="chain_users" class="userpick" data-placeholder="Search for the step assignee…" required><option value="">— select a user —</option></select><input name="chain_notes" placeholder="Required action (optional)"><button type="button" class="btn ghost rmstep">✕</button></div></template><button class="btn">Create Ticket</button></form>{% endblock %}
