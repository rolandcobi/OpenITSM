{% extends 'base.html' %}{% block content %}<div class="page-title"><h2>My account</h2></div><section class="card" style="max-width:520px"><h3>Change password</h3><p><small>{{u.full_name}} · {{u.username}}{% if u.must_change %} — <b>You must set a new password before continuing.</b>{% endif %}</small></p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current" required autocomplete="current-password"></label><label>New password (minimum 12 characters)<input type="password" name="new" required minlength="12" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm" required minlength="12" autocomplete="new-password"></label><button>Save password</button></form></section>{% endblock %}
